<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Tracker App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-body">
            <h3 class="text-center mb-4">Task Tracker</h3>

            <!-- Task Input -->
            <div class="input-group mb-3">
              <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
              <button class="btn btn-primary" onclick="addTask()">Add</button>
            </div>

            <!-- Task List -->
            <ul class="list-group" id="taskList"></ul>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    function addTask() {
      const taskInput = document.getElementById("taskInput");
      const taskText = taskInput.value.trim();

      if (taskText === "") {
        alert("Please enter a task");
        return;
      }

      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";

      const span = document.createElement("span");
      span.textContent = taskText;
      span.style.cursor = "pointer";
      span.onclick = function () {
        toggleTask(span);
      };

      const button = document.createElement("button");
      button.textContent = "Delete";
      button.className = "btn btn-sm btn-danger";
      button.onclick = function () {
        deleteTask(button);
      };

      li.appendChild(span);
      li.appendChild(button);
      document.getElementById("taskList").appendChild(li);

      taskInput.value = "";
    }

    function deleteTask(button) {
      button.parentElement.remove();
    }

    function toggleTask(task) {
      task.classList.toggle("text-decoration-line-through");
      task.classList.toggle("text-muted");
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
